- name: Generate HTML report and send email
  hosts: localhost
  run_once: true
  vars:
    report_file: /tmp/server_audit.html
  vars_prompt:
   - name: project_name
     prompt: Project Name?
     private: no
   - name: cdr_no
     prompt: Jira CDR No?
     private: no
   - name: archer_id
     prompt: Archer ID Demand?
     private: no

  tasks:

    - name: Generate HTML report
      template:
        src: report.html.j2
        dest: "{{ report_file }}"
      vars:
        report_hosts: "{{ groups['m2m'] }}"

    - name: Rename file using mv
      ansible.builtin.command: >
        mv -f /tmp/server_audit.html /tmp/{{ project_name }}_server_report.html

